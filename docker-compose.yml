version: "3.8"

services:
  db:
    image: localhost/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zgt}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - zgt_net
    ports:
      - "127.0.0.1:${DB_LOCAL_PORT:-34599}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-zgt}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: localhost/zgt-backend:latest
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zgt}
    depends_on:
      - db
    networks:
      - zgt_net
    restart: "no"

  backend:
    image: localhost/zgt-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zgt}
    depends_on:
      - db
      - migrate
    networks:
      - zgt_net
    ports:
      - "${BACKEND_HOST:-0.0.0.0}:${BACKEND_PORT:-38801}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: localhost/zgt-frontend:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      - backend
    networks:
      - zgt_net
    ports:
      - "${FRONTEND_HOST:-0.0.0.0}:${FRONTEND_PORT:-38800}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pg_data:
    driver: local

networks:
  zgt_net:
    driver: bridge