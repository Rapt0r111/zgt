version: "3.8"

services:
  db:
    image: postgres:16-alpine          # ← убрали localhost/
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zgt}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - zgt_net
    ports:
      - "127.0.0.1:${DB_LOCAL_PORT:-34599}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-zgt}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:                             # ← добавили build
      context: ./backend
      dockerfile: Dockerfile
    image: zgt-backend:latest
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zgt}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zgt_net
    restart: "no"

  backend:
    build:                             # ← добавили build
      context: ./backend
      dockerfile: Dockerfile
    image: zgt-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zgt}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zgt_net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:                             # ← добавили build
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: zgt-frontend:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      - backend
    networks:
      - zgt_net
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:                               # ← добавили nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - zgt_net

volumes:
  pg_data:
    driver: local

networks:
  zgt_net:
    driver: bridge