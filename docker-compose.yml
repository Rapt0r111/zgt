name: zgt

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zgt}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - zgt_net
    ports:
      # Привязан только к localhost — для psql/pgAdmin без exposing в сеть.
      # Порт 34599 максимально нестандартный, не конфликтует ни с PostgreSQL
      # (5432/5433), ни с Hyper-V/WSL2 зарезервированными диапазонами.
      # Меняется через DB_LOCAL_PORT в .env
      - "127.0.0.1:${DB_LOCAL_PORT:-34599}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-zgt}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Migration job (runs once, then exits) ───────────────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zgt}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zgt_net
    restart: no

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zgt}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - zgt_net
    ports:
      # Порт 38801 — нестандартный, не пересекается с распространёнными сервисами,
      # не попадает в диапазоны, резервируемые Hyper-V/WSL2 на Windows.
      # Меняется через BACKEND_PORT в .env
      - "${BACKEND_HOST:-0.0.0.0}:${BACKEND_PORT:-38801}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_API_URL вшивается в бандл при сборке.
        # После изменения — пересобрать: docker compose build frontend
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:38801}
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - zgt_net
    ports:
      # Порт 38800 — нестандартный, пара к backend 38801.
      # Меняется через FRONTEND_PORT в .env
      - "${FRONTEND_HOST:-0.0.0.0}:${FRONTEND_PORT:-38800}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pg_data:
    driver: local

networks:
  # Одна внутренняя сеть — достаточно для связи db↔backend.
  # Frontend обращается к backend через браузер клиента (NEXT_PUBLIC_API_URL),
  # а не напрямую контейнер→контейнер.
  zgt_net:
    driver: bridge