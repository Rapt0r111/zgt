version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zgt}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_LOCAL_PORT:-34599}:5432"
    networks:
      - zgt_net

  backend:
    build:
      context: ./backend
    image: zgt-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zgt}
    depends_on:
      - db
    ports:
      - "38801:8000"   # ← ВАЖНО
    networks:
      - zgt_net

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: zgt-frontend:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      - backend
    ports:
      - "38800:3000"   # ← ВАЖНО
    networks:
      - zgt_net

volumes:
  pg_data:

networks:
  zgt_net: